name: Deploy JiaPixel to Vercel (Zero Build Cost)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  deploy-vercel-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Merge Build Env from GitHub Secret (Overrides Vercel Secret Placeholders)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            node -e '
              const fs = require("fs");
              const p = ".vercel/.env.production.local";
              const existing = fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "";
              const parse = (s) => {
                const map = new Map();
                for (const line of s.split(/\r?\n/)) {
                  const m = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/);
                  if (m) map.set(m[1], m[2]);
                }
                return map;
              };
              const merged = parse(existing);
              for (const [k, v] of parse(process.env.ENV_FILE || "")) {
                merged.set(k, v);
              }
              const out = [...merged.entries()].map(([k, v]) => `${k}=${v}`).join("\n") + "\n";
              fs.writeFileSync(p, out);
              console.log(`Merged ${merged.size} env vars into ${p}`);
            '
          fi

      - name: Build Project on GitHub Runner ($0 Vercel Build Cost)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Auto-Purge Cloudflare Cache (Optional)
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "Cloudflare secrets not set, skipping purge."
          fi
